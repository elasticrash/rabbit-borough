[package]
name = "rabbit_borough"
version = "0.2.0"
authors = ["stefanos.kouroupis <manekato@gmail.com>"]
edition = "2024"
rust-version = "1.85"
description = "Create a RabbitMQ consumer project with minimal effort, by bypassing templating, configuration and complicated resiliency logic"
readme = "CRATE.md"
documentation = "https://docs.rs/rabbit_borough"
repository = "https://github.com/elasticrash/rabbit-borough"
license = "MIT"
keywords = ["rabbitmq", "amqp"]

[dependencies]
lapin = { version = "4.12", default-features = false, features = ["rustls", "async-global-executor"] }
async-io = "2.6"
percent-encoding = "2.3"
futures-lite = "2.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
async-io = "2.6"
futures = { version = "0.3", features = ["executor"] }
postgres = "0.19"
r2d2_postgres = "0.18"
r2d2 = "0.8"
